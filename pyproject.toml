[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robanayt_ai"
version = "0.5.0"
description = "Robanayt AI - local-first personal assistant (Phase 8)"
readme = "README.md"
requires-python = ">=3.10"
# Phase 0: zero runtime dependencies. Heavy deps (torch, silero, piper,
# opencv, mcp) are planned for later phases only.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
robanayt-ai = "robanayt_ai.app:main"

[tool.setuptools.packages.find]
include = ["robanayt_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Позволяет `import robanayt_ai` без установки пакета в окружение.
pythonpath = ["."]
